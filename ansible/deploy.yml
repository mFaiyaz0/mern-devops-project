---
- name: Configure and deploy MERN application
  hosts: webservers
  become: true

  vars:
    app_dir: /home/ubuntu/mern-app

  tasks:

    - name: Update apt package cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy production Docker Compose file
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create production environment file
      copy:
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          JWT_SECRET={{ jwt_secret }}
          ADMIN_NAME={{ admin_name }}
          ADMIN_EMAIL={{ admin_email }}
          ADMIN_PASSWORD={{ admin_password }}
      no_log: true

    - name: Pull Docker images
      command:
        cmd: docker compose pull
        chdir: "{{ app_dir }}"

    - name: Start MERN application
      command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"