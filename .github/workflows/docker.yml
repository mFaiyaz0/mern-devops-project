name: Build and Deploy MERN Application

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout Repository
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Docker Buildx
      # =========================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Docker Hub Login
      # =========================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # Build Frontend
      # =========================

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: faizanite/mern-taskmanager-frontend:latest

      # =========================
      # Build Backend
      # =========================

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: faizanite/mern-taskmanager-backend:latest

      # =========================
      # Setup SSH
      # =========================

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # =========================
      # Install Ansible
      # =========================

      - name: Install Ansible
        run: |
          python3 -m pip install ansible

      # =========================
      # Deploy with Ansible
      # =========================

      - name: Deploy using Ansible
        run: |
          cd ansible

          ansible-playbook deploy.yml \
            -i inventory \
            --private-key ~/.ssh/ec2_key.pem \
            -e "ansible_host=${{ secrets.EC2_HOST }}" \
            -e "jwt_secret=${{ secrets.JWT_SECRET }}" \
            -e "admin_name=${{ secrets.ADMIN_NAME }}" \
            -e "admin_email=${{ secrets.ADMIN_EMAIL }}" \
            -e "admin_password=${{ secrets.ADMIN_PASSWORD }}"