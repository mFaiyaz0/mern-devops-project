
name: Build and Deploy MERN Application

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: faizanite/mern-taskmanager-frontend:latest

      # Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: faizanite/mern-taskmanager-backend:latest

      # Configure SSH
      - name: Setup SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          echo "Creating SSH directory"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "Checking required SSH secrets"
          if [ -z "$EC2_SSH_KEY_B64" ]; then
            echo "Error: EC2_SSH_KEY_B64 secret is empty or missing."
            exit 1
          fi

          if [ -z "$EC2_HOST" ]; then
            echo "Error: EC2_HOST secret is empty or missing."
            exit 1
          fi

          echo "Decoding SSH private key"
          printf '%s' "$EC2_SSH_KEY_B64" |
            base64 --decode > "$HOME/.ssh/ec2_key.pem"
          chmod 600 "$HOME/.ssh/ec2_key.pem"

          if [ ! -s "$HOME/.ssh/ec2_key.pem" ]; then
            echo "Error: Decoded SSH key is empty."
            exit 1
          fi

          echo "Validating SSH private key"
          ssh-keygen -y -f "$HOME/.ssh/ec2_key.pem" > /dev/null

          echo "Scanning EC2 host key"
          ssh-keyscan -H "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts" \
            2> "$HOME/.ssh/keyscan.log"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "Error: No SSH host key was collected."
            cat "$HOME/.ssh/keyscan.log"
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH setup completed"

      # Install Ansible
      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Deploy using Ansible
      - name: Deploy using Ansible
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu

          cd ansible

          ansible-playbook deploy.yml \
            -i inventory \
            --private-key "$HOME/.ssh/ec2_key.pem" \
            -e "ansible_host=$EC2_HOST" \
            -e "jwt_secret=$JWT_SECRET" \
            -e "admin_name=$ADMIN_NAME" \
            -e "admin_email=$ADMIN_EMAIL" \
            -e "admin_password=$ADMIN_PASSWORD"
